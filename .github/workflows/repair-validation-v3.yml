name: Repair validation v3

on:
  push:
    branches: [hotfix/mobileclip2-fast-scan-engine]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/mobileclip2-fast-scan-engine
          fetch-depth: 1
      - name: Apply deterministic validation fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          test = Path('integration_test/mobileclip2_full_single_fixed_test.dart')
          s = test.read_text()
          s = s.replace('int _width,', 'int width,', 1)
          if 'int _width,' in s:
              raise SystemExit('validation helper parameter was not repaired')
          if 'inner = max(0, r - width)' not in s:
              raise SystemExit('validation helper body unexpectedly changed')
          test.write_text(s)

          workflow = Path('.github/workflows/android-pr.yml')
          w = workflow.read_text()
          marker = '          emulator-options: >-\n'
          if 'pre-emulator-launch-script:' not in w:
              replacement = "          pre-emulator-launch-script: >-\n            bash -lc \"command -v convert >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y imagemagick); convert -size 640x480 xc:'#f0f2f5' -fill '#d03a34' -draw 'roundrectangle 170,75 470,405 45,45' -fill '#20262e' -draw 'rectangle 245,40 395,95' -fill white -draw 'roundrectangle 205,180 435,265 12,12' /tmp/mobileclip2_camera_scene.png; test -s /tmp/mobileclip2_camera_scene.png\"\n" + marker
              if marker not in w:
                  raise SystemExit('android workflow emulator-options marker not found')
              w = w.replace(marker, replacement, 1)
          if '-camera-back imagefile:/tmp/mobileclip2_camera_scene.png' not in w:
              w = w.replace('            -no-boot-anim\n          disable-animations:', '            -no-boot-anim\n            -no-snapshot-load\n            -no-snapshot-save\n            -camera-back imagefile:/tmp/mobileclip2_camera_scene.png\n          disable-animations:', 1)
          workflow.write_text(w)

          print('validation helper repaired:', 'int _width,' not in s)
          print('deterministic camera configured:', '-camera-back imagefile:/tmp/mobileclip2_camera_scene.png' in w)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration_test/mobileclip2_full_single_fixed_test.dart .github/workflows/android-pr.yml
          git commit -m "fix: repair validation helper and configure deterministic emulator camera"
          git push
          git rm .github/workflows/repair-validation-v3.yml
          git commit -m "chore: remove one-shot validation repair v3"
          git push
