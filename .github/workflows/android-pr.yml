name: Android PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Install Android NDK 27.0.12077973
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" --channel=0

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run full MobileCLIP2 Android integration suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
          disable-animations: true
          script: |
            bash -lc 'set -o pipefail; timeout 900s flutter test integration_test/mobileclip2_full_android_test.dart 2>&1 | tee android_runtime_test.log'

      - name: Upload Android runtime test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-test-log
          path: android_runtime_test.log
          retention-days: 7
          if-no-files-found: warn

      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build_output.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-pr-build-log
          path: build_output.log
          retention-days: 7

      - name: Verify APK exists
        run: |
          echo "=== flutter-apk output directory ==="
          ls -R build/app/outputs/flutter-apk || true
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH — build step must have failed silently."
            exit 1
          fi
          echo "APK found: $(du -sh $APK_PATH)"

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: android-pr-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
