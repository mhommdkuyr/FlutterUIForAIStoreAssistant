name: Android PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Install Android NDK 27.0.12077973
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" --channel=0

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run full MobileCLIP2 Android integration suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          pre-emulator-launch-script: |
            set -e
            if ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y imagemagick
            fi
            convert -size 640x480 xc:'#f0f2f5' \
              -fill '#cd322d' -draw 'roundrectangle 170,75 470,405 45,45' \
              -fill '#1e232a' -draw 'rectangle 245,40 395,95' \
              -fill white -draw 'roundrectangle 205,180 435,265 12,12' \
              /tmp/mobileclip2_camera_scene.png
            test -s /tmp/mobileclip2_camera_scene.png
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -no-snapshot-load
            -no-snapshot-save
            -camera-back imagefile:/tmp/mobileclip2_camera_scene.png
          disable-animations: true
          script: |
            bash -lc 'set -o pipefail; timeout 900s flutter test integration_test/mobileclip2_full_single_fixed_test.dart 2>&1 | tee android_runtime_test.log'

      - name: Upload Android runtime test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-test-log
          path: android_runtime_test.log
          retention-days: 7
          if-no-files-found: warn

      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build_output.log

      - name: Validate debug APK structure, assets, manifest, install and launch
        run: |
          set -euo pipefail
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK_PATH"
          unzip -t "$APK_PATH" >/dev/null
          echo "APK size: $(du -h "$APK_PATH" | cut -f1)"
          echo "Checking Flutter MobileCLIP2 assets..."
          unzip -l "$APK_PATH" | grep -F 'flutter_assets/assets/models/mobileclip2/mobileclip2_s0_vision.onnx' >/dev/null
          unzip -l "$APK_PATH" | grep -F 'flutter_assets/assets/models/mobileclip2/mobileclip2_s0_vision.onnx.data' >/dev/null
          unzip -l "$APK_PATH" | grep -F 'flutter_assets/assets/models/mobileclip2/model_metadata.json' >/dev/null
          echo "Checking package metadata..."
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK_PATH" | grep -F "package: name='com.aistoreassistant.ai_store_assistant'" >/dev/null
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump permissions "$APK_PATH" | grep -F 'android.permission.CAMERA' >/dev/null
          echo "Installing APK into the same validated emulator..."
          adb install -r "$APK_PATH"
          adb shell pm path com.aistoreassistant.ai_store_assistant
          adb shell am force-stop com.aistoreassistant.ai_store_assistant
          adb shell monkey -p com.aistoreassistant.ai_store_assistant 1 >/dev/null
          sleep 5
          adb shell pidof com.aistoreassistant.ai_store_assistant

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-pr-build-log
          path: build_output.log
          retention-days: 7
          if-no-files-found: warn

      - name: Verify APK exists
        run: |
          echo "=== flutter-apk output directory ==="
          ls -R build/app/outputs/flutter-apk || true
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH — build step must have failed silently."
            exit 1
          fi
          echo "APK found: $(du -sh $APK_PATH)"

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: android-pr-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
