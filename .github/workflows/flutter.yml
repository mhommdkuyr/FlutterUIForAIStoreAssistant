name: Flutter Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify Flutter Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # FAST_SCAN_ONE_TIME_PATCH_START
      - name: One-time live scanner hardening
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 20
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          screen = 'lib/features/product_scanner/screens/live_scanner_screen.dart'
          replace(screen, "import 'dart:async';\n", "import 'dart:async';\nimport 'dart:io';\n")
          replace(screen, '  CameraController? _cameraController;\n', '  CameraController? _cameraController;\n  CameraDescription? _cameraDescription;\n')
          replace(
              screen,
              '    _statusResetTimer?.cancel();\n    _cameraController?.dispose();\n',
              '    _statusResetTimer?.cancel();\n    unawaited(_pipeline.dispose());\n    _cameraController?.dispose();\n',
          )
          replace(
              screen,
              '      if (mounted) setState(() => _products = products);\n\n      await _pipeline.initialize();\n',
              '''      if (mounted) setState(() => _products = products);\n\n      // Start the real camera preview before model/index initialization.\n      // This prevents a model/index failure from looking like a dead camera.\n      await _startVisualCamera(startStream: false);\n      if (mounted) {\n        setState(() {\n          _isLoading = false;\n          _status = _ScanStatus.initializing;\n        });\n      }\n\n      await _pipeline.initialize();\n''',
          )
          replace(
              screen,
              '      await _startVisualCamera();\n\n      if (!mounted) return;\n',
              '      await _cameraController?.startImageStream(_onCameraFrame);\n\n      if (!mounted) return;\n',
          )
          replace(
              screen,
              '  Future<void> _startVisualCamera() async {\n',
              '  Future<void> _startVisualCamera({bool startStream = true}) async {\n',
          )
          replace(
              screen,
              '    await controller.initialize();\n    _cameraController = controller;\n    await controller.startImageStream(_onCameraFrame);\n',
              '''    await controller.initialize();\n    _cameraDescription = camera;\n    _cameraController = controller;\n    try {\n      await controller.setFocusMode(FocusMode.auto);\n    } catch (_) {\n      // Some devices do not expose programmable autofocus.\n    }\n    if (startStream) {\n      await controller.startImageStream(_onCameraFrame);\n    }\n''',
          )
          replace(
              screen,
              '        final report = await _pipeline.processFrame(frame);\n',
              '''        final report = await _pipeline.processFrame(\n          frame,\n          rotationDegrees: _frameRotationDegrees(),\n        );\n''',
          )
          anchor = '  void _trackCameraFps() {\n'
          helper = '''  int _frameRotationDegrees() {\n    final description = _cameraDescription;\n    final controller = _cameraController;\n    if (!Platform.isAndroid || description == null || controller == null) {\n      return 0;\n    }\n    final deviceRotation = switch (controller.value.deviceOrientation) {\n      DeviceOrientation.portraitUp => 0,\n      DeviceOrientation.landscapeLeft => 90,\n      DeviceOrientation.portraitDown => 180,\n      DeviceOrientation.landscapeRight => 270,\n    };\n    if (description.lensDirection == CameraLensDirection.front) {\n      return (description.sensorOrientation + deviceRotation) % 360;\n    }\n    return (description.sensorOrientation - deviceRotation + 360) % 360;\n  }\n\n'''
          replace(screen, anchor, helper + anchor)

          # Relax the pre-inference quality gate only for the fast engine so a
          # distant/brief product is still attempted instead of being discarded.
          pipeline = 'lib/shared/services/recognition_pipeline.dart'
          replace(
              pipeline,
              '      if (!quality.isAcceptable(_config)) {\n',
              '''      final qualityConfig = _fastMode\n          ? const RecognitionConfig(\n              minFrameBrightness: 8,\n              maxFrameBrightness: 247,\n              minFrameLumaStdDev: 2,\n            )\n          : _config;\n      if (!quality.isAcceptable(qualityConfig)) {\n''',
          )

          # Add a compile-only contract test for the fast service and dynamic batch.
          test_path = Path('test/fast_scan_engine_contract_test.dart')
          test_path.write_text('''import 'package:flutter_test/flutter_test.dart';\n\nimport 'package:ai_store_assistant/shared/services/fast_visual_embedding_service.dart';\nimport 'package:ai_store_assistant/shared/services/visual_embedding_service.dart';\n\nvoid main() {\n  test('dynamic MobileCLIP2 batch is accepted', () {\n    expect(\n      MobileClip2ModelContract.detectGraphLayout([-1, 3, 224, 224], 224),\n      'NCHW',\n    );\n  });\n\n  test('fast provider starts unavailable and reports the new contract version', () {\n    final provider = FastVisualEmbeddingProvider();\n    expect(provider.isOnnxActive, isFalse);\n    expect(provider.embeddingLength, 0);\n    expect(provider.modelVersion, 'mobileclip2_s0_vision_onnx_v2_fastscan');\n    expect(provider.similarity(Uint8List(0), Uint8List(0)), 0.0);\n  });\n}\n''')

          # Remove this one-time patch step and write permission from the workflow
          # in the SAME commit as the source changes. This keeps the final workflow
          # clean and prevents future PRs from running a special-case mutator.
          workflow = Path('.github/workflows/flutter.yml').read_text()
          start = workflow.index('      # FAST_SCAN_ONE_TIME_PATCH_START')
          end_marker = '      # FAST_SCAN_ONE_TIME_PATCH_END'
          end = workflow.index(end_marker)
          end = workflow.index('\n', end) + 1
          workflow = workflow[:start] + workflow[end:]
          workflow = workflow.replace('permissions:\n  contents: write\n\n', '', 1)
          Path('.github/workflows/flutter.yml').write_text(workflow)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/product_scanner/screens/live_scanner_screen.dart \
                  lib/shared/services/recognition_pipeline.dart \
                  test/fast_scan_engine_contract_test.dart \
                  .github/workflows/flutter.yml
          git commit -m 'Harden fast camera scanning lifecycle and quality gate'
          git push origin HEAD:"$TARGET_BRANCH"
      # FAST_SCAN_ONE_TIME_PATCH_END

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install Android NDK 27.0.12077973
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" --channel=0

      - name: Install dependencies
        run: flutter pub get

      - name: Dart analyze
        shell: bash
        run: |
          set +e
          dart analyze --format=json --no-fatal-warnings > dart_analyze.json
          status=$?
          set -e
          cat dart_analyze.json
          python3 - "$status" dart_analyze.json <<'PY'
          import json
          import sys
          status = int(sys.argv[1])
          path = sys.argv[2]
          with open(path, encoding='utf-8') as f:
              data = json.load(f)
          diagnostics = data.get('diagnostics', []) if isinstance(data, dict) else []
          errors = [item for item in diagnostics if isinstance(item, dict) and str(item.get('severity', '')).upper() == 'ERROR']
          if errors:
              print(f'Dart analyzer reported {len(errors)} error diagnostics; failing CI.')
              sys.exit(1)
          print(f'Dart analyzer completed without error diagnostics (tool exit code: {status}; warnings/info are non-fatal).')
          sys.exit(0)
          PY

      - name: Flutter analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-warnings > flutter_analyze.txt 2>&1
          status=$?
          set -e
          cat flutter_analyze.txt
          if grep -Eq '^ *error •' flutter_analyze.txt; then
            echo 'Flutter analyzer reported error diagnostics; failing CI.'
            exit 1
          fi
          echo "Flutter analyzer reported no error diagnostics (warnings/info are non-fatal; tool exit code: $status)."
          exit 0

      - name: Focused MobileCLIP2 contract tests
        run: flutter test test/mobileclip2_contract_test.dart

      - name: Fast scan engine contract tests
        run: flutter test test/fast_scan_engine_contract_test.dart

      - name: Focused recognition pipeline tests
        run: flutter test test/recognition_pipeline_test.dart

      - name: Focused visual recognition integration tests
        run: flutter test test/visual_recognition_integration_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Verify MobileCLIP2 asset
        run: dart run tools/verify_mobileclip2_asset.dart

      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build_output.log

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee release_build_output.log

      - name: Upload final APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-store-assistant-final-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-verification-build-log
          path: |
            build_output.log
            release_build_output.log
          retention-days: 7
