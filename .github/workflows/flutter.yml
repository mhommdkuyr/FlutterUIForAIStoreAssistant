name: Flutter Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Verify Flutter Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install Android NDK 27.0.12077973
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" --channel=0

      - name: Install dependencies
        run: flutter pub get

      - name: Dart analyze
        shell: bash
        run: |
          set +e
          dart analyze --format=json --no-fatal-warnings > dart_analyze.json
          status=$?
          set -e
          cat dart_analyze.json

          python3 - "$status" dart_analyze.json <<'PY'
          import json
          import sys

          status = int(sys.argv[1])
          path = sys.argv[2]
          with open(path, encoding="utf-8") as f:
              raw = f.read()

          try:
              data = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f"Dart analyzer did not produce valid JSON: {exc}")
              sys.exit(1)

          def diagnostics(value):
              if isinstance(value, dict):
                  if "severity" in value and any(k in value for k in ("code", "problemMessage", "problem")):
                      yield value
                  for child in value.values():
                      yield from diagnostics(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from diagnostics(child)

          fatal = []
          seen = set()
          for issue in diagnostics(data):
              key = json.dumps(issue, sort_keys=True, ensure_ascii=False)
              if key in seen:
                  continue
              seen.add(key)
              severity = str(issue.get("severity", "")).strip().lower()
              if severity in {"error", "warning"}:
                  fatal.append(issue)

          if fatal:
              print(f"Dart analyzer reported {len(fatal)} error/warning diagnostics; failing CI.")
              sys.exit(1)

          if status != 0:
              print(f"Dart analyzer returned exit code {status}, but produced no error/warning diagnostics; treating info-only diagnostics as non-fatal.")
          else:
              print("Dart analyzer completed with no error/warning diagnostics.")
          sys.exit(0)
          PY

      - name: Flutter analyze
        shell: bash
        run: |
          set +e
          flutter analyze --format=json --no-fatal-warnings > flutter_analyze.json
          status=$?
          set -e
          cat flutter_analyze.json

          python3 - "$status" flutter_analyze.json <<'PY'
          import json
          import sys

          status = int(sys.argv[1])
          path = sys.argv[2]
          with open(path, encoding="utf-8") as f:
              raw = f.read()

          try:
              data = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f"Flutter analyzer did not produce valid JSON: {exc}")
              sys.exit(1)

          def diagnostics(value):
              if isinstance(value, dict):
                  if "severity" in value and any(k in value for k in ("code", "problemMessage", "problem")):
                      yield value
                  for child in value.values():
                      yield from diagnostics(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from diagnostics(child)

          fatal = []
          seen = set()
          for issue in diagnostics(data):
              key = json.dumps(issue, sort_keys=True, ensure_ascii=False)
              if key in seen:
                  continue
              seen.add(key)
              severity = str(issue.get("severity", "")).strip().lower()
              if severity in {"error", "warning"}:
                  fatal.append(issue)

          if fatal:
              print(f"Flutter analyzer reported {len(fatal)} error/warning diagnostics; failing CI.")
              sys.exit(1)

          if status != 0:
              print(f"Flutter analyzer returned exit code {status}, but produced no error/warning diagnostics; treating info-only diagnostics as non-fatal.")
          else:
              print("Flutter analyzer completed with no error/warning diagnostics.")
          sys.exit(0)
          PY

      - name: Focused MobileCLIP2 contract tests
        run: flutter test test/mobileclip2_contract_test.dart

      - name: Focused recognition pipeline tests
        run: flutter test test/recognition_pipeline_test.dart

      - name: Focused visual recognition integration tests
        run: flutter test test/visual_recognition_integration_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Verify MobileCLIP2 asset
        run: dart run tools/verify_mobileclip2_asset.dart

      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build_output.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-verification-build-log
          path: build_output.log
          retention-days: 7
