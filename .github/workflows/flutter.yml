name: Flutter Verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify Flutter Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install Android NDK 27.0.12077973
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" --channel=0

      - name: Install dependencies
        run: flutter pub get

      - name: Dart analyze
        shell: bash
        run: |
          set +e
          dart analyze --format=json --no-fatal-infos --no-fatal-warnings > dart_analyze.json
          status=$?
          set -e
          cat dart_analyze.json
          exit "$status"

      - name: Flutter analyze
        shell: bash
        run: |
          set +e
          flutter analyze --format=json --no-fatal-infos --no-fatal-warnings > flutter_analyze.json
          status=$?
          set -e
          cat flutter_analyze.json
          exit "$status"

      - name: Focused MobileCLIP2 contract tests
        run: flutter test test/mobileclip2_contract_test.dart

      - name: Focused recognition pipeline tests
        run: flutter test test/recognition_pipeline_test.dart

      - name: Focused visual recognition integration tests
        run: flutter test test/visual_recognition_integration_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Verify MobileCLIP2 asset
        run: dart run tools/verify_mobileclip2_asset.dart

      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build_output.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-verification-build-log
          path: build_output.log
          retention-days: 7
