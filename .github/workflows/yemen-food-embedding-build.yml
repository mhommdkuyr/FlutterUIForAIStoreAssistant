name: Yemen Food Embedding Build

on:
  push:
    branches: [data/yemen-food-embedding-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install data/ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir numpy pillow requests beautifulsoup4 onnxruntime

      - name: Build expanded catalog and MobileCLIP2 embeddings
        run: |
          python tools/build_yemen_food_embeddings.py \
            --max-pages 40 \
            --max-products 4000 \
            --augments 10 \
            --max-images-per-product 3

      - name: Validate generated artifacts
        run: |
          test -s build/yemen_food_catalog/catalog.json
          test -s build/yemen_food_catalog/catalog_embeddings.npz
          test -s build/yemen_food_catalog/catalog_embedding_labels.json
          test -s build/yemen_food_catalog/catalog_embedding_rows.json
          test -s build/yemen_food_catalog/build_stats.json
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          root = Path('build/yemen_food_catalog')
          stats = json.loads((root/'build_stats.json').read_text())
          data = np.load(root/'catalog_embeddings.npz')['embeddings']
          assert data.ndim == 2 and data.shape[1] == 512, data.shape
          assert stats['productsWithImages'] > 0, stats
          assert stats['embeddingVectors'] == int(data.shape[0]), stats
          print(json.dumps(stats, ensure_ascii=False, indent=2))
          print('embedding archive shape:', data.shape, 'dtype:', data.dtype)
          PY

      - name: Publish visual catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: yemen-food-mobileclip2-catalog
          path: build/yemen_food_catalog/
          retention-days: 30
          if-no-files-found: error
