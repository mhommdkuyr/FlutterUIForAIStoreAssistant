name: Ibb OSM 300m Grid Coverage Collection

on:
  push:
    branches:
      - ibb-google-places-collector
  workflow_dispatch:

concurrency:
  group: ibb-osm-300m-scan
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/osm_ibb_collector/requirements.txt

      - name: Dry run
        working-directory: tools/osm_ibb_collector
        run: python collector.py --bbox-json ibb_city_box.json --tile-km 0.3 --grid-step-m 300 --pause-seconds 0.8 --dry-run

      - name: Collect Ibb 300m grid
        working-directory: tools/osm_ibb_collector
        timeout-minutes: 220
        run: |
          python collector.py             --bbox-json ibb_city_box.json             --output-dir output             --tile-km 0.3             --grid-step-m 300             --pause-seconds 0.8

      - name: Upload collection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibb-osm-grid-coverage
          path: tools/osm_ibb_collector/output/
          if-no-files-found: warn
          retention-days: 7
