name: Ibb OSM Coverage Collection

on:
  push:
    branches:
      - ibb-google-places-collector
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/osm_ibb_collector/requirements.txt

      - name: Dry run
        working-directory: tools/osm_ibb_collector
        run: python collector.py --bbox-json ../ibb_google_places_collector/ibb_city_box.json --dry-run

      - name: Collect Ibb mapped businesses
        working-directory: tools/osm_ibb_collector
        run: |
          python collector.py             --bbox-json ../ibb_google_places_collector/ibb_city_box.json             --output-dir output             --tile-km 3.0             --pause-seconds 1.5

      - name: Upload collection artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibb-osm-coverage
          path: tools/osm_ibb_collector/output/
          retention-days: 7
