name: Apply MobileCLIP2 Fast Scan Engine Patch

on:
  push:
    branches:
      - hotfix/mobileclip2-fast-scan-engine

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Apply production fast-scan hardening
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .fast_scan_engine_applied
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source block not found in {path}')
              p.write_text(text.replace(old, new, count))

          # 1) MobileCLIP2 runtime: camera orientation, center crop, EXIF orientation,
          # XNNPACK/CPU session tuning, model contract version bump, and async camera API.
          replace(
              'lib/shared/services/visual_embedding_service.dart',
              '  Future<Uint8List?> embedFrame(CameraImage image);\n',
              '  Future<Uint8List?> embedFrame(CameraImage image, {int rotationDegrees = 0});\n',
          )
          replace(
              'lib/shared/services/visual_embedding_service.dart',
              "      final session = await _runtime.createSession(modelPath);\n",
              "      final availableProviders = await _runtime.getAvailableProviders();\n      final providers = <OrtProvider>[\n        if (availableProviders.contains(OrtProvider.XNNPACK)) OrtProvider.XNNPACK,\n        OrtProvider.CPU,\n      ];\n      final sessionOptions = OrtSessionOptions(\n        intraOpNumThreads: 4,\n        interOpNumThreads: 1,\n        useArena: true,\n        providers: providers,\n      );\n      final session = await _runtime.createSession(\n        modelPath,\n        options: sessionOptions,\n      );\n",
          )
          replace(
              'lib/shared/services/visual_embedding_service.dart',
              "  String get modelVersion => 'mobileclip2_s0_vision_onnx_v1';\n",
              "  String get modelVersion => 'mobileclip2_s0_vision_onnx_v2_fastscan';\n",
          )
          replace(
              'lib/shared/services/visual_embedding_service.dart',
              "  Future<Uint8List?> embedFrame(CameraImage image) async {\n",
              "  Future<Uint8List?> embedFrame(\n    CameraImage image, {\n    int rotationDegrees = 0,\n  }) async {\n",
          )
          replace(
              'lib/shared/services/visual_embedding_service.dart',
              '      final input = _prepareFrameTensor(image);\n',
              '      final input = _prepareFrameTensor(image, rotationDegrees: rotationDegrees);\n',
          )
          replace(
              'lib/shared/services/visual_embedding_service.dart',
              "  Float32List? _prepareFrameTensor(CameraImage image) {\n    switch (image.format.group) {\n      case ImageFormatGroup.yuv420:\n        return _fromYuv420(image);\n      case ImageFormatGroup.bgra8888:\n        return _fromBgra8888(image);\n      default:\n        final decoded = img.decodeImage(image.planes[0].bytes);\n        return decoded == null ? null : _prepareImageTensor(decoded);\n    }\n  }\n",
              "  Float32List? _prepareFrameTensor(\n    CameraImage image, {\n    int rotationDegrees = 0,\n  }) {\n    switch (image.format.group) {\n      case ImageFormatGroup.yuv420:\n        return _fromYuv420(image, rotationDegrees);\n      case ImageFormatGroup.bgra8888:\n        return _fromBgra8888(image, rotationDegrees);\n      default:\n        final decoded = img.decodeImage(image.planes[0].bytes);\n        return decoded == null ? null : _prepareImageTensor(decoded);\n    }\n  }\n",
          )
          replace(
              'lib/shared/services/visual_embedding_service.dart',
              '    final size = _requireContract().inputSize;\n    final resized = img.copyResize(decoded, width: size, height: size);\n',
              "    final size = _requireContract().inputSize;\n    final oriented = img.bakeOrientation(decoded);\n    final cropSize = min(oriented.width, oriented.height);\n    final cropped = img.copyCrop(\n      oriented,\n      x: (oriented.width - cropSize) ~/ 2,\n      y: (oriented.height - cropSize) ~/ 2,\n      width: cropSize,\n      height: cropSize,\n    );\n    final resized = img.copyResize(\n      cropped,\n      width: size,\n      height: size,\n      interpolation: img.Interpolation.linear,\n    );\n",
          )
          replace(
              'lib/shared/services/visual_embedding_service.dart',
              "  Float32List _fromYuv420(CameraImage image) {\n    final size = _requireContract().inputSize, w = image.width, h = image.height;\n    final yPlane = image.planes[0], uPlane = image.planes[1], vPlane = image.planes[2];\n    final uvStep = uPlane.bytesPerPixel ?? 1;\n    final input = Float32List(size * size * 3);\n    for (var row = 0; row < size; row++) {\n      for (var col = 0; col < size; col++) {\n        final sx = (col * w / size).toInt().clamp(0, w - 1), sy = (row * h / size).toInt().clamp(0, h - 1);\n        final yIdx = sy * yPlane.bytesPerRow + sx, uvRow = sy >> 1, uvCol = sx >> 1;\n        final uIdx = uvRow * uPlane.bytesPerRow + uvCol * uvStep, vIdx = uvRow * vPlane.bytesPerRow + uvCol * uvStep;\n        final yv = yIdx < yPlane.bytes.length ? yPlane.bytes[yIdx] : 0;\n        final uv = uIdx < uPlane.bytes.length ? uPlane.bytes[uIdx] - 128 : 0;\n        final vv = vIdx < vPlane.bytes.length ? vPlane.bytes[vIdx] - 128 : 0;\n        _writePixel(input, row, col, (yv + 1.402 * vv).clamp(0, 255).toDouble(), (yv - 0.344136 * uv - 0.714136 * vv).clamp(0, 255).toDouble(), (yv + 1.772 * uv).clamp(0, 255).toDouble());\n      }\n    }\n    return input;\n  }\n",
              "  Float32List _fromYuv420(CameraImage image, int rotationDegrees) {\n    final size = _requireContract().inputSize, w = image.width, h = image.height;\n    final yPlane = image.planes[0], uPlane = image.planes[1], vPlane = image.planes[2];\n    final uvStep = uPlane.bytesPerPixel ?? 1;\n    final cropSize = min(w, h);\n    final cropLeft = (w - cropSize) ~/ 2;\n    final cropTop = (h - cropSize) ~/ 2;\n    final rotation = ((rotationDegrees % 360) + 360) % 360;\n    final input = Float32List(size * size * 3);\n    for (var row = 0; row < size; row++) {\n      for (var col = 0; col < size; col++) {\n        final p = col * cropSize ~/ size;\n        final q = row * cropSize ~/ size;\n        late final int sx;\n        late final int sy;\n        switch (rotation) {\n          case 90:\n            sx = cropLeft + q;\n            sy = cropTop + cropSize - 1 - p;\n            break;\n          case 180:\n            sx = cropLeft + cropSize - 1 - p;\n            sy = cropTop + cropSize - 1 - q;\n            break;\n          case 270:\n            sx = cropLeft + cropSize - 1 - q;\n            sy = cropTop + p;\n            break;\n          default:\n            sx = cropLeft + p;\n            sy = cropTop + q;\n        }\n        final safeX = sx.clamp(0, w - 1);\n        final safeY = sy.clamp(0, h - 1);\n        final yIdx = safeY * yPlane.bytesPerRow + safeX;\n        final uvRow = safeY >> 1, uvCol = safeX >> 1;\n        final uIdx = uvRow * uPlane.bytesPerRow + uvCol * uvStep;\n        final vIdx = uvRow * vPlane.bytesPerRow + uvCol * uvStep;\n        final yv = yIdx < yPlane.bytes.length ? yPlane.bytes[yIdx] : 0;\n        final uv = uIdx < uPlane.bytes.length ? uPlane.bytes[uIdx] - 128 : 0;\n        final vv = vIdx < vPlane.bytes.length ? vPlane.bytes[vIdx] - 128 : 0;\n        _writePixel(\n          input, row, col,\n          (yv + 1.402 * vv).clamp(0, 255).toDouble(),\n          (yv - 0.344136 * uv - 0.714136 * vv).clamp(0, 255).toDouble(),\n          (yv + 1.772 * uv).clamp(0, 255).toDouble(),\n        );\n      }\n    }\n    return input;\n  }\n",
          )
          replace(
              'lib/shared/services/visual_embedding_service.dart',
              "  Float32List _fromBgra8888(CameraImage image) {\n    final size = _requireContract().inputSize, w = image.width, h = image.height;\n    final bytes = image.planes[0].bytes, stride = image.planes[0].bytesPerRow;\n    final input = Float32List(size * size * 3);\n    for (var row = 0; row < size; row++) {\n      for (var col = 0; col < size; col++) {\n        final sx = (col * w / size).toInt().clamp(0, w - 1), sy = (row * h / size).toInt().clamp(0, h - 1);\n        final base = sy * stride + sx * 4;\n        if (base < 0 || base + 3 >= bytes.length) {\n          _writePixel(input, row, col, 0, 0, 0);\n          continue;\n        }\n        final b = bytes[base].toDouble();\n        final g = bytes[base + 1].toDouble();\n        final r = bytes[base + 2].toDouble();\n        _writePixel(input, row, col, r, g, b);\n      }\n    }\n    return input;\n  }\n",
              "  Float32List _fromBgra8888(CameraImage image, int rotationDegrees) {\n    final size = _requireContract().inputSize, w = image.width, h = image.height;\n    final bytes = image.planes[0].bytes, stride = image.planes[0].bytesPerRow;\n    final cropSize = min(w, h);\n    final cropLeft = (w - cropSize) ~/ 2;\n    final cropTop = (h - cropSize) ~/ 2;\n    final rotation = ((rotationDegrees % 360) + 360) % 360;\n    final input = Float32List(size * size * 3);\n    for (var row = 0; row < size; row++) {\n      for (var col = 0; col < size; col++) {\n        final p = col * cropSize ~/ size;\n        final q = row * cropSize ~/ size;\n        late final int sx;\n        late final int sy;\n        switch (rotation) {\n          case 90:\n            sx = cropLeft + q;\n            sy = cropTop + cropSize - 1 - p;\n            break;\n          case 180:\n            sx = cropLeft + cropSize - 1 - p;\n            sy = cropTop + cropSize - 1 - q;\n            break;\n          case 270:\n            sx = cropLeft + cropSize - 1 - q;\n            sy = cropTop + p;\n            break;\n          default:\n            sx = cropLeft + p;\n            sy = cropTop + q;\n        }\n        final safeX = sx.clamp(0, w - 1);\n        final safeY = sy.clamp(0, h - 1);\n        final base = safeY * stride + safeX * 4;\n        if (base < 0 || base + 3 >= bytes.length) {\n          _writePixel(input, row, col, 0, 0, 0);\n          continue;\n        }\n        final b = bytes[base].toDouble();\n        final g = bytes[base + 1].toDouble();\n        final r = bytes[base + 2].toDouble();\n        _writePixel(input, row, col, r, g, b);\n      }\n    }\n    return input;\n  }\n",
          )
          replace(
              'lib/shared/services/visual_embedding_service.dart',
              '  Future<Uint8List?> embedFrame(CameraImage image) async => null;\n',
              '  Future<Uint8List?> embedFrame(CameraImage image, {int rotationDegrees = 0}) async => null;\n',
          )

          # 2) Pipeline: propagate camera rotation and add a real lifecycle close.
          replace(
              'lib/shared/services/recognition_pipeline.dart',
              '  Future<RecognitionFrameReport> processFrame(CameraImage image) async {\n',
              '  Future<RecognitionFrameReport> processFrame(\n    CameraImage image, {\n    int rotationDegrees = 0,\n  }) async {\n',
          )
          replace(
              'lib/shared/services/recognition_pipeline.dart',
              '      final embedding = await _embedding.embedFrame(image);\n',
              '      final embedding = await _embedding.embedFrame(\n        image,\n        rotationDegrees: rotationDegrees,\n      );\n',
          )
          anchor = '  void reset() {\n    _locks.reset();\n    _tracker.reset();\n    _frameCount = 0;\n    _processing = false;\n  }\n'
          addition = anchor + '\n  Future<void> dispose() async {\n    _active = false;\n    _tracker.reset();\n    _locks.reset();\n    await _embedding.dispose();\n  }\n'
          replace('lib/shared/services/recognition_pipeline.dart', anchor, addition)

          # 3) Persistence: remove the fake UUID upsert behavior and keep latest row.
          replace(
              'lib/shared/services/embedding_persistence_service.dart',
              '    final rows = await (_db.select(_db.productEmbeddings)\n          ..where((t) => t.modelVersion.equals(modelVersion)))\n        .get();\n',
              '    final rows = await (_db.select(_db.productEmbeddings)\n          ..where((t) => t.modelVersion.equals(modelVersion))\n          ..orderBy([(t) => OrderingTerm.desc(t.createdAt)]))\n        .get();\n',
          )
          replace(
              'lib/shared/services/embedding_persistence_service.dart',
              "      result\n          .putIfAbsent(row.productId, () => {})\n          .putIfAbsent(row.imagePath ?? '', () => row.hashBytes as Uint8List);\n",
              "      final product = result.putIfAbsent(row.productId, () => {});\n      product.putIfAbsent(row.imagePath ?? '', () => row.hashBytes as Uint8List);\n",
          )
          replace(
              'lib/shared/services/embedding_persistence_service.dart',
              "    await _db.into(_db.productEmbeddings).insertOnConflictUpdate(companion);\n",
              "    await (_db.delete(_db.productEmbeddings)\n          ..where((t) =>\n              t.productId.equals(productId) &\n              t.imagePath.equals(imagePath) &\n              t.modelVersion.equals(modelVersion)))\n        .go();\n    await _db.into(_db.productEmbeddings).insert(companion);\n",
          )

          # 4) Index: never trust a stale/wrong-length cached vector; dedupe paths.
          replace(
              'lib/shared/services/local_product_index_service.dart',
              '      final paths =\n          _pathsFor(product, extraImagePaths[product.id] ?? const []);\n',
              '      final paths = _pathsFor(\n        product,\n        extraImagePaths[product.id] ?? const [],\n      ).toSet().toList(growable: false);\n',
          )
          replace(
              'lib/shared/services/local_product_index_service.dart',
              '        if (fromCache != null) {\n          hashes.add(fromCache);\n          continue;\n        }\n',
              '        if (fromCache != null &&\n            fromCache.length == _embedding.embeddingLength) {\n          hashes.add(fromCache);\n          continue;\n        }\n',
          )

          # 5) Live camera: camera starts before model/index work, camera rotation is passed to ML,
          # scan no longer pauses for 1.8s, and per-product locking handles duplicates.
          replace('lib/features/product_scanner/screens/live_scanner_screen.dart', "import 'dart:async';\n", "import 'dart:async';\nimport 'dart:io';\n")
          replace(
              'lib/features/product_scanner/screens/live_scanner_screen.dart',
              '  CameraController? _cameraController;\n',
              '  CameraController? _cameraController;\n  CameraDescription? _cameraDescription;\n',
          )
          replace(
              'lib/features/product_scanner/screens/live_scanner_screen.dart',
              '        frameSkip: 5,\n        minMargin: 0.12,\n        minSupportingReferences: 1,\n        confirmationFrames: 3,\n        absentTicksToUnlock: 12,\n',
              '        frameSkip: 1,\n        minMargin: 0.12,\n        minSupportingReferences: 1,\n        confirmationFrames: 2,\n        absentTicksToUnlock: 2,\n',
          )
          replace(
              'lib/features/product_scanner/screens/live_scanner_screen.dart',
              '    _statusResetTimer?.cancel();\n    _cameraController?.dispose();\n',
              '    _statusResetTimer?.cancel();\n    unawaited(_pipeline.dispose());\n    _cameraController?.dispose();\n',
          )
          replace(
              'lib/features/product_scanner/screens/live_scanner_screen.dart',
              '      await _pipeline.initialize();\n      if (!_pipeline.isOnnxActive) {\n',
              '      // Start camera first so model/index initialization cannot make the camera look dead.\n      await _startVisualCamera();\n      if (mounted) {\n        setState(() {\n          _isLoading = false;\n          _status = _ScanStatus.initializing;\n        });\n      }\n\n      await _pipeline.initialize();\n      if (!_pipeline.isOnnxActive) {\n',
          )
          replace(
              'lib/features/product_scanner/screens/live_scanner_screen.dart',
              '      await _pipeline.buildIndex(products, extraImagePaths: extraPaths);\n      if (!_pipeline.isIndexReady || _pipeline.indexedEmbeddingCount == 0) {\n',
              '      await _pipeline.buildIndex(products, extraImagePaths: extraPaths);\n      if (!_pipeline.isIndexReady || _pipeline.indexedEmbeddingCount == 0) {\n',
          )
          replace(
              'lib/features/product_scanner/screens/live_scanner_screen.dart',
              '      await _startVisualCamera();\n\n      if (!mounted) return;\n      setState(() {\n        _isLoading = false;\n        _status = _ScanStatus.ready;\n      });\n',
              '      if (!mounted) return;\n      setState(() {\n        _isLoading = false;\n        _status = _ScanStatus.ready;\n      });\n',
          )
          replace(
              'lib/features/product_scanner/screens/live_scanner_screen.dart',
              '    await controller.initialize();\n    _cameraController = controller;\n    await controller.startImageStream(_onCameraFrame);\n',
              '    await controller.initialize();\n    _cameraDescription = camera;\n    _cameraController = controller;\n    try {\n      await controller.setFocusMode(FocusMode.auto);\n    } catch (_) {\n      // Some cameras do not expose a programmable focus mode.\n    }\n    await controller.startImageStream(_onCameraFrame);\n',
          )
          replace(
              'lib/features/product_scanner/screens/live_scanner_screen.dart',
              '        final report = await _pipeline.processFrame(frame);\n',
              '        final report = await _pipeline.processFrame(\n          frame,\n          rotationDegrees: _frameRotationDegrees(),\n        );\n',
          )
          anchor = '  void _trackCameraFps() {\n'
          helper = '''  int _frameRotationDegrees() {\n    final description = _cameraDescription;\n    final controller = _cameraController;\n    if (!Platform.isAndroid || description == null || controller == null) return 0;\n    final compensation = switch (controller.value.deviceOrientation) {\n      DeviceOrientation.portraitUp => 0,\n      DeviceOrientation.landscapeLeft => 90,\n      DeviceOrientation.portraitDown => 180,\n      DeviceOrientation.landscapeRight => 270,\n    };\n    if (description.lensDirection == CameraLensDirection.front) {\n      return (description.sensorOrientation + compensation) % 360;\n    }\n    return (description.sensorOrientation - compensation + 360) % 360;\n  }\n\n'''
          replace('lib/features/product_scanner/screens/live_scanner_screen.dart', anchor, helper + anchor)
          replace(
              'lib/features/product_scanner/screens/live_scanner_screen.dart',
              '    _addToCart(product);\n    _pipeline.pause();\n    _overlayAnimCtrl.forward(from: 0);\n',
              '    _addToCart(product);\n    // Keep the recognition engine running. ScanLockManager suppresses duplicates\n    // without imposing a global pause between unrelated products.\n    _overlayAnimCtrl.forward(from: 0);\n',
          )
          replace(
              'lib/features/product_scanner/screens/live_scanner_screen.dart',
              '      _overlayAnimCtrl.reverse();\n      _pipeline.resume();\n      setState(() {\n',
              '      _overlayAnimCtrl.reverse();\n      setState(() {\n',
          )

          Path('.fast_scan_engine_applied').write_text('applied\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/shared/services/visual_embedding_service.dart \
                  lib/shared/services/recognition_pipeline.dart \
                  lib/shared/services/local_product_index_service.dart \
                  lib/shared/services/embedding_persistence_service.dart \
                  lib/features/product_scanner/screens/live_scanner_screen.dart \
                  .fast_scan_engine_applied
          git rm .github/workflows/_apply_fast_scan_engine.yml
          git commit -m 'Rebuild MobileCLIP2 for fast continuous live scanning'
          git push origin HEAD:hotfix/mobileclip2-fast-scan-engine
