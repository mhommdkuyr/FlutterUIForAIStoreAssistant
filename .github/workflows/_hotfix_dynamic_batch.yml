name: Temporary MobileCLIP2 Dynamic Batch Fix

on:
  push:
    branches:
      - hotfix/mobileclip2-device-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'temp: fix dynamic ONNX batch contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/mobileclip2-device-runtime
          fetch-depth: 0
      - name: Patch validator and regression test
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          service = Path('lib/shared/services/visual_embedding_service.dart')
          text = service.read_text()
          old = """    if (inputShape[0] != 1) {\n      throw StateError('MobileCLIP2 input batch must be 1, got $inputShape.');\n    }\n"""
          new = """    // ONNX uses -1 for a dynamic batch dimension. The runtime sends a\n    // concrete batch of 1, so both static 1 and dynamic -1 are valid.\n    if (inputShape[0] != 1 && inputShape[0] != -1) {\n      throw StateError(\n        'MobileCLIP2 input batch dimension must be 1 or dynamic (-1), got $inputShape.',\n      );\n    }\n"""
          if old not in text:
              raise SystemExit('expected validator block not found')
          service.write_text(text.replace(old, new, 1))

          test = Path('test/mobileclip2_contract_test.dart')
          t = test.read_text()
          old_test = """    test('[1,224,224,3] is NHWC', () {\n      expect(\n        MobileClip2ModelContract.detectGraphLayout([1, 224, 224, 3], 224),\n        'NHWC',\n      );\n    });\n\n"""
          new_test = old_test + """    test('dynamic batch [-1,3,224,224] is valid NCHW', () {\n      expect(\n        MobileClip2ModelContract.detectGraphLayout([-1, 3, 224, 224], 224),\n        'NCHW',\n      );\n    });\n\n"""
          if old_test not in t:
              raise SystemExit('expected test insertion point not found')
          test.write_text(t.replace(old_test, new_test, 1))
          PY
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/shared/services/visual_embedding_service.dart test/mobileclip2_contract_test.dart
          git commit -m 'Fix MobileCLIP2 dynamic batch validation'
          git push origin HEAD:hotfix/mobileclip2-device-runtime
