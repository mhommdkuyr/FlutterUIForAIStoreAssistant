name: Yemen 3000 SKU Release Candidate

on:
  workflow_dispatch:
  push:
    branches: [feature/yemen-3000-runtime-catalog]
  pull_request:
    branches: [main]
    paths:
      - 'tools/build_yemen_3000_catalog.py'
      - 'data/yemen_food_catalog_seed.json'
      - 'assets/models/mobileclip2/**'
      - 'lib/**'
      - 'pubspec.yaml'

permissions:
  contents: read

env:
  TARGET_PRODUCTS: '3000'

jobs:
  train-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir numpy pillow requests onnxruntime
      - name: Build 3000-SKU catalog and MobileCLIP2 centroids
        run: |
          python tools/build_yemen_3000_catalog.py \
            --target-products "$TARGET_PRODUCTS" \
            --augments 8 \
            --download-workers 12
      - name: Validate exact 3000-product result
        run: |
          python - <<'PY'
          import json, numpy as np
          from pathlib import Path
          root = Path('build/yemen_food_catalog')
          stats = json.loads((root/'build_stats.json').read_text())
          catalog = json.loads((root/'catalog.json').read_text())
          labels = json.loads((root/'catalog_labels.json').read_text())
          emb = np.fromfile(root/'catalog_centroids.f16', dtype=np.float16).reshape(-1, 512)
          assert stats['catalogProducts'] == 3000, stats
          assert stats['trainedProducts'] == 3000, stats
          assert len(catalog) == len(labels) == emb.shape[0] == 3000
          assert emb.shape[1] == 512
          assert all(p.get('recognitionReady') is True for p in catalog)
          assert len({p['id'] for p in catalog}) == 3000
          assert len(set(labels)) == 3000
          print(json.dumps(stats, ensure_ascii=False, indent=2))
          print('catalog:', len(catalog), 'centroids:', emb.shape)
          PY
      - name: Publish 3000-SKU training artifact
        uses: actions/upload-artifact@v4
        with:
          name: yemen-3000-mobileclip2-catalog
          path: build/yemen_food_catalog/
          retention-days: 30
          if-no-files-found: error
      - name: Stage generated runtime assets
        run: |
          mkdir -p assets/generated
          cp build/yemen_food_catalog/catalog.json assets/generated/yemen_food_catalog_3000.json
          cp build/yemen_food_catalog/catalog_labels.json assets/generated/yemen_food_catalog_labels.json
          cp build/yemen_food_catalog/catalog_centroids.f16 assets/generated/yemen_food_catalog_centroids.f16
          cp build/yemen_food_catalog/build_stats.json assets/generated/yemen_food_catalog_stats.json
      - uses: actions/upload-artifact@v4
        with:
          name: yemen-3000-runtime-assets
          path: assets/generated/
          retention-days: 30
          if-no-files-found: error

  release-apk:
    needs: train-catalog
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download runtime assets
        uses: actions/download-artifact@v4
        with:
          name: yemen-3000-runtime-assets
          path: assets/generated
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Focused visual tests
        run: |
          flutter test test/mobileclip2_model_contract_test.dart
          flutter test test/local_product_index_service_test.dart
          flutter test test/recognition_pipeline_test.dart
          flutter test test/visual_recognition_integration_test.dart
      - name: Full tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify APK and generated catalog are present
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -F 'assets/flutter_assets/assets/generated/yemen_food_catalog_3000.json'
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -F 'assets/flutter_assets/assets/generated/yemen_food_catalog_centroids.f16'
      - uses: actions/upload-artifact@v4
        with:
          name: ai-store-assistant-yemen-3000-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
