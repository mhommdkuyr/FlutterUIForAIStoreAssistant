name: Apply MobileCLIP2 Device Runtime Hotfix

on:
  push:
    branches:
      - hotfix/mobileclip2-device-runtime

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Apply runtime and diagnostics hotfix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          service = Path('lib/shared/services/visual_embedding_service.dart')
          text = service.read_text()

          replacements = [
              (
                  "import 'package:flutter/services.dart';\n",
                  "import 'package:flutter/services.dart';\nimport 'package:path_provider/path_provider.dart';\n",
              ),
              (
                  "  String? _outputName;\n",
                  "  String? _outputName;\n  String? _runtimeModelPath;\n  String? _runtimeExternalDataPath;\n",
              ),
              (
                  "      final session = await _runtime.createSessionFromAsset(assetPath);\n      try {\n        _contract = await _validateSessionContract(session);\n        _session = session;\n",
                  "      await _materializeRuntimeAssets();\n      final modelPath = _runtimeModelPath;\n      if (modelPath == null) {\n        throw StateError('MobileCLIP2 runtime model was not materialized.');\n      }\n      final session = await _runtime.createSession(modelPath);\n      try {\n        final validatedContract = await _validateSessionContract(session);\n        await _smokeTestSession(session, validatedContract);\n        _contract = validatedContract;\n        _session = session;\n",
              ),
              (
                  "  Future<MobileClip2ModelContract> _validateSessionContract(OrtSession session) async {\n",
                  "  Future<void> _materializeRuntimeAssets() async {\n    final baseDir = await getTemporaryDirectory();\n    final runtimeDir = Directory(\n      '${baseDir.path}${Platform.pathSeparator}mobileclip2_runtime',\n    );\n    if (!runtimeDir.existsSync()) {\n      await runtimeDir.create(recursive: true);\n    }\n\n    final modelFile = File(\n      '${runtimeDir.path}${Platform.pathSeparator}mobileclip2_s0_vision.onnx',\n    );\n    final dataFile = File(\n      '${runtimeDir.path}${Platform.pathSeparator}mobileclip2_s0_vision.onnx.data',\n    );\n\n    final modelAsset = await rootBundle.load(assetPath);\n    await modelFile.writeAsBytes(\n      modelAsset.buffer.asUint8List(\n        modelAsset.offsetInBytes,\n        modelAsset.lengthInBytes,\n      ),\n      flush: true,\n    );\n\n    final externalDataAsset = await rootBundle.load(externalDataAssetPath);\n    await dataFile.writeAsBytes(\n      externalDataAsset.buffer.asUint8List(\n        externalDataAsset.offsetInBytes,\n        externalDataAsset.lengthInBytes,\n      ),\n      flush: true,\n    );\n\n    if (await modelFile.length() == 0 || await dataFile.length() == 0) {\n      throw StateError('MobileCLIP2 runtime assets were materialized empty.');\n    }\n\n    _runtimeModelPath = modelFile.path;\n    _runtimeExternalDataPath = dataFile.path;\n  }\n\n  Future<void> _smokeTestSession(\n    OrtSession session,\n    MobileClip2ModelContract contract,\n  ) async {\n    final inputName = _inputName;\n    final outputName = _outputName;\n    if (inputName == null || outputName == null) {\n      throw StateError('MobileCLIP2 smoke test missing input/output names.');\n    }\n\n    final shape = contract.layout == 'NHWC'\n        ? [1, contract.inputSize, contract.inputSize, 3]\n        : [1, 3, contract.inputSize, contract.inputSize];\n    final inputTensor = await OrtValue.fromList(\n      Float32List(contract.inputSize * contract.inputSize * 3),\n      shape,\n    );\n    Map<String, OrtValue>? outputs;\n    try {\n      outputs = await session.run({inputName: inputTensor});\n      final output = outputs[outputName];\n      if (output == null) {\n        throw StateError('MobileCLIP2 smoke test returned no output.');\n      }\n      final values = (await output.asFlattenedList()).cast<num>();\n      if (values.length != contract.embeddingDimensions) {\n        throw StateError(\n          'MobileCLIP2 smoke test returned ${values.length} values; expected ${contract.embeddingDimensions}.',\n        );\n      }\n      for (final value in values) {\n        final number = value.toDouble();\n        if (!number.isFinite) {\n          throw StateError('MobileCLIP2 smoke test produced non-finite output.');\n        }\n      }\n    } finally {\n      await inputTensor.dispose();\n      if (outputs != null) {\n        for (final output in outputs.values) {\n          await output.dispose();\n        }\n      }\n    }\n  }\n\n  Future<MobileClip2ModelContract> _validateSessionContract(OrtSession session) async {\n",
              ),
              (
                  "    _inferenceQueue = _inferenceQueue.then((_) async {\n      await _session?.close();\n      _session = null;\n    });\n    await _inferenceQueue;\n    // flutter_onnxruntime 1.8.3 exposes OrtSession.close() and\n",
                  "    _inferenceQueue = _inferenceQueue.then((_) async {\n      await _session?.close();\n      _session = null;\n    });\n    await _inferenceQueue;\n    final runtimePaths = <String>[\n      if (_runtimeModelPath != null) _runtimeModelPath!,\n      if (_runtimeExternalDataPath != null) _runtimeExternalDataPath!,\n    ];\n    for (final filePath in runtimePaths) {\n      try {\n        final file = File(filePath);\n        if (await file.exists()) {\n          await file.delete();\n        }\n      } catch (_) {}\n    }\n    _runtimeModelPath = null;\n    _runtimeExternalDataPath = null;\n    // flutter_onnxruntime 1.8.3 exposes OrtSession.close() and\n",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected service replacement anchor: {old[:100]!r}')
              text = text.replace(old, new, 1)

          service.write_text(text)

          pipeline = Path('lib/shared/services/recognition_pipeline.dart')
          ptext = pipeline.read_text()
          old = "  String get backendName {\n    if (_embedding is VisualEmbeddingProvider) {\n      return isOnnxActive ? 'ONNX Runtime' : 'visual engine unavailable';\n    }\n    return _embedding.runtimeType.toString();\n  }\n"
          new = old + "\n  Object? get initializationError =>\n      _embedding is VisualEmbeddingProvider\n          ? (_embedding as VisualEmbeddingProvider).initializationError\n          : null;\n\n  Object? get lastInferenceError =>\n      _embedding is VisualEmbeddingProvider\n          ? (_embedding as VisualEmbeddingProvider).lastInferenceError\n          : null;\n"
          if old not in ptext:
              raise SystemExit('Missing recognition pipeline backend anchor')
          ptext = ptext.replace(old, new, 1)

          # Respect valid Y-plane pixels and row stride instead of sampling padding bytes.
          old = """    final yPlane = image.planes.first.bytes;\n    if (yPlane.isEmpty) {\n      return const _FrameQuality(meanBrightness: 0, lumaStdDev: 0);\n    }\n\n    const maxSamples = 1200;\n    final step = (yPlane.length / maxSamples).ceil().clamp(1, 1 << 30);\n    var count = 0;\n    var sum = 0.0;\n    var sumSq = 0.0;\n    for (var i = 0; i < yPlane.length; i += step) {\n      final v = yPlane[i].toDouble();\n      sum += v;\n      sumSq += v * v;\n      count++;\n    }\n"""
          new = """    final plane = image.planes.first;\n    final yPlane = plane.bytes;\n    if (yPlane.isEmpty || image.width <= 0 || image.height <= 0) {\n      return const _FrameQuality(meanBrightness: 0, lumaStdDev: 0);\n    }\n\n    const maxSamples = 1200;\n    final pixelCount = image.width * image.height;\n    final pixelStep = (pixelCount / maxSamples).ceil().clamp(1, 1 << 30);\n    var count = 0;\n    var sum = 0.0;\n    var sumSq = 0.0;\n    for (var index = 0; index < pixelCount; index += pixelStep) {\n      final row = index ~/ image.width;\n      final col = index % image.width;\n      final offset = row * plane.bytesPerRow + col;\n      if (offset >= yPlane.length) continue;\n      final v = yPlane[offset].toDouble();\n      sum += v;\n      sumSq += v * v;\n      count++;\n    }\n    if (count == 0) {\n      return const _FrameQuality(meanBrightness: 0, lumaStdDev: 0);\n    }\n"""
          if old not in ptext:
              raise SystemExit('Missing frame quality anchor')
          ptext = ptext.replace(old, new, 1)
          pipeline.write_text(ptext)

          screen = Path('lib/features/product_scanner/screens/live_scanner_screen.dart')
          stext = screen.read_text()
          old = "      await _pipeline.initialize();\n      await _pipeline.buildIndex(products, extraImagePaths: extraPaths);\n"
          new = """      await _pipeline.initialize();\n      if (!_pipeline.isOnnxActive) {\n        throw StateError(\n          _pipeline.initializationError?.toString() ??\n              'MobileCLIP2 ONNX visual engine is unavailable.',\n        );\n      }\n      await _pipeline.buildIndex(products, extraImagePaths: extraPaths);\n      if (!_pipeline.isIndexReady || _pipeline.indexedEmbeddingCount == 0) {\n        throw StateError(\n          'MobileCLIP2 index contains no usable product embeddings. Verify product image paths and runtime initialization.',\n        );\n      }\n"""
          if old not in stext:
              raise SystemExit('Missing live scanner initialization anchor')
          stext = stext.replace(old, new, 1)
          screen.write_text(stext)
          PY

          git diff --check
          git diff -- lib/shared/services/visual_embedding_service.dart lib/shared/services/recognition_pipeline.dart lib/features/product_scanner/screens/live_scanner_screen.dart

          # Remove this temporary mutator workflow before committing the actual fix.
          rm .github/workflows/apply-mobileclip2-device-hotfix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/shared/services/visual_embedding_service.dart lib/shared/services/recognition_pipeline.dart lib/features/product_scanner/screens/live_scanner_screen.dart .github/workflows/apply-mobileclip2-device-hotfix.yml
          git commit -m "Fix MobileCLIP2 Android external-data runtime"
          git push origin HEAD:${GITHUB_REF_NAME}
