name: CI — Format · Analyze · Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Toolchain ─────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: "stable"
          cache: true

      # ── Install SQLite (needed by Drift tests on Linux) ───────────────────
      - name: Install libsqlite3-dev
        run: sudo apt-get update -y && sudo apt-get install -y libsqlite3-dev

      # ── Dependencies ──────────────────────────────────────────────────────
      - name: flutter pub get
        run: flutter pub get

      # ── Format ────────────────────────────────────────────────────────────
      # Fails the build if any file is not already formatted.
      # Run `dart format lib/ test/` locally to fix formatting before pushing.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      # ── Analyze ───────────────────────────────────────────────────────────
      # Errors are fatal. Warnings and infos are reported but do not block CI.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # ── Test ──────────────────────────────────────────────────────────────
      - name: Run tests
        run: flutter test --reporter=expanded

      # ── Upload artifacts on failure ───────────────────────────────────────
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test/
          retention-days: 7
