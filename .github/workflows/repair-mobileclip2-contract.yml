name: Repair MobileCLIP2 preprocessing contract

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hotfix/mobileclip2-fast-scan-engine
          fetch-depth: 1

      - name: Apply verified MobileCLIP2-S0 contract and preprocessing optimization
        shell: python
        run: |
          from pathlib import Path

          visual = Path('lib/shared/services/visual_embedding_service.dart')
          text = visual.read_text()
          text = text.replace('static const expectedMean = [0.48145466, 0.4578275, 0.40821073];', 'static const expectedMean = [0.0, 0.0, 0.0];')
          text = text.replace('static const expectedStd = [0.26862954, 0.26130258, 0.27577711];', 'static const expectedStd = [1.0, 1.0, 1.0];')
          visual.write_text(text)

          fast = Path('lib/shared/services/fast_visual_embedding_service.dart')
          text = fast.read_text()
          old = '''    final contract = _requireContract();
    final values = [
      (r / 255.0 - contract.mean[0]) / contract.std[0],
      (g / 255.0 - contract.mean[1]) / contract.std[1],
      (b / 255.0 - contract.mean[2]) / contract.std[2],
    ];
    if (contract.layout == 'NHWC') {'''
          new = '''    // MobileCLIP2-S0 official preprocessing is RGB in [0,1] with
    // mean=(0,0,0) and std=(1,1,1). Avoid a temporary List allocation for
    // every pixel; this path executes 50,176 times per camera frame.
    final contract = _requireContract();
    final rv = r / 255.0;
    final gv = g / 255.0;
    final bv = b / 255.0;
    if (contract.layout == 'NHWC') {'''
          if old not in text:
              raise SystemExit('expected preprocessing block not found')
          text = text.replace(old, new, 1)
          text = text.replace('''      tensor[base] = values[0];
      tensor[base + 1] = values[1];
      tensor[base + 2] = values[2];''', '''      tensor[base] = rv;
      tensor[base + 1] = gv;
      tensor[base + 2] = bv;''', 1)
          text = text.replace('''      tensor[offset] = values[0];
      tensor[planeSize + offset] = values[1];
      tensor[(planeSize * 2) + offset] = values[2];''', '''      tensor[offset] = rv;
      tensor[planeSize + offset] = gv;
      tensor[(planeSize * 2) + offset] = bv;''', 1)
          fast.write_text(text)

          tests = Path('test/mobileclip2_contract_test.dart')
          text = tests.read_text()
          text = text.replace('expect(contract.mean, [0.48145466, 0.4578275, 0.40821073]);', 'expect(contract.mean, [0.0, 0.0, 0.0]);')
          text = text.replace('expect(contract.std, [0.26862954, 0.26130258, 0.27577711]);', 'expect(contract.std, [1.0, 1.0, 1.0]);')
          text = text.replace("'mean': [0.48145566, 0.4578275, 0.40821073],\n        'std': [0.26862954, 0.26130258, 0.27577711],", "'mean': [0.000001, 0.0, 0.0],\n        'std': [1.0, 1.0, 1.0],")
          text = text.replace("'mean': [0.48145466, 0.4578275, 0.40821073],\n        'std': [0.26862954, 0.26130258, 0.27577711],", "'mean': [0.0, 0.0, 0.0],\n        'std': [1.000001, 1.0, 1.0],")
          tests.write_text(text)

          Path('assets/models/mobileclip2/README.md').write_text('# MobileCLIP2-S0 Vision ONNX\n\nUse RGB images at 224x224. Official MobileCLIP2-S0 preprocessing is RGB float32 scaled to [0,1] with mean=(0,0,0) and std=(1,1,1). Output is L2-normalized by the application.\n')

          manifest = Path('assets/models/mobileclip2/MANIFEST.md')
          text = manifest.read_text().replace('Input: RGB float32 after metadata-defined CLIP normalization', 'Input: RGB float32 in [0,1], with mean=(0,0,0) and std=(1,1,1), matching the official MobileCLIP2-S0 preprocessing contract')
          manifest.write_text(text)

      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/shared/services/visual_embedding_service.dart lib/shared/services/fast_visual_embedding_service.dart test/mobileclip2_contract_test.dart assets/models/mobileclip2/README.md assets/models/mobileclip2/MANIFEST.md
          git commit -m "fix: align MobileCLIP2-S0 preprocessing and optimize pixel path"
          git rm .github/workflows/repair-mobileclip2-contract.yml
          git commit -m "chore: remove one-shot MobileCLIP2 repair workflow"
          git push
