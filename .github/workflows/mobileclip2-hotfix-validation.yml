name: MobileCLIP2 Hotfix Validation

on:
  push:
    branches:
      - hotfix/mobileclip2-device-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install Android NDK 27.0.12077973
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" --channel=0

      - name: Install dependencies
        run: flutter pub get

      - name: Dart analyze
        run: |
          set +e
          dart analyze --format=json --no-fatal-warnings > dart_analyze.json
          status=$?
          set -e
          cat dart_analyze.json
          python3 - "$status" dart_analyze.json <<'PY'
          import json, sys
          status = int(sys.argv[1])
          with open(sys.argv[2], encoding='utf-8') as f:
              data = json.load(f)
          diagnostics = data.get('diagnostics', []) if isinstance(data, dict) else []
          errors = [d for d in diagnostics if isinstance(d, dict) and str(d.get('severity','')).upper() == 'ERROR']
          if errors:
              raise SystemExit(1)
          print(f'No Dart error diagnostics; analyzer exit code was {status}.')
          PY

      - name: Flutter analyze
        run: |
          set +e
          flutter analyze --no-fatal-warnings > flutter_analyze.txt 2>&1
          status=$?
          set -e
          cat flutter_analyze.txt
          if grep -Eq '^ *error •' flutter_analyze.txt; then exit 1; fi
          echo "No Flutter error diagnostics; analyzer exit code was $status."

      - name: Focused MobileCLIP2 contract tests
        run: flutter test test/mobileclip2_contract_test.dart

      - name: Recognition pipeline tests
        run: flutter test test/recognition_pipeline_test.dart

      - name: Visual integration tests
        run: flutter test test/visual_recognition_integration_test.dart

      - name: Full Flutter tests
        run: flutter test

      - name: Verify MobileCLIP2 asset
        run: dart run tools/verify_mobileclip2_asset.dart

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release
