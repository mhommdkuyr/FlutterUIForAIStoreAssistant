name: Repair validation v2

on:
  push:
    branches: [hotfix/mobileclip2-fast-scan-engine]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/mobileclip2-fast-scan-engine
          fetch-depth: 1
      - name: Repair analyzer error and make camera deterministic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integration_test/mobileclip2_full_single_fixed_test.dart')
          s = p.read_text()
          s = s.replace('  int _width,\n) {\n  final outer = r * r;', '  int width,\n) {\n  final outer = r * r;', 1)
          p.write_text(s)

          workflow = Path('.github/workflows/android-pr.yml')
          w = workflow.read_text()
          w = w.replace(
              '          emulator-options: >-\n            -no-window\n            -gpu swiftshader_indirect\n            -noaudio\n            -no-boot-anim\n          disable-animations: true\n',
              '          pre-emulator-launch-script: >-\n            bash -lc "convert -size 640x480 xc:\'#f0f2f5\' -fill \'#d03a34\' -draw \'roundrectangle 170,75 470,405 45,45\' -fill \'#20262e\' -draw \'rectangle 245,40 395,95\' -fill white -draw \'roundrectangle 205,180 435,265 12,12\' /tmp/mobileclip2_camera_scene.png"\n          emulator-options: >-\n            -no-window\n            -gpu swiftshader_indirect\n            -noaudio\n            -no-boot-anim\n            -no-snapshot-load\n            -no-snapshot-save\n            -camera-back imagefile:/tmp/mobileclip2_camera_scene.png\n          disable-animations: true\n',
          )
          workflow.write_text(w)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration_test/mobileclip2_full_single_fixed_test.dart .github/workflows/android-pr.yml
          git commit -m "fix: correct validation helper and deterministic emulator camera"
          git push
          git rm .github/workflows/repair-validation-v2.yml
          git commit -m "chore: remove one-shot validation repair v2"
          git push
