include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # onnx_vision_provider.dart references package:onnxruntime which is not
    # yet declared in pubspec.yaml. Incomplete code for a future ONNX vision
    # feature. Re-enabled when the dependency is added.
    - lib/features/ai_assistant/services/onnx_vision_provider.dart
  errors:
    # Ignore deprecated_member_use from the Flutter framework (withOpacity
    # deprecation in Flutter 3.32+). Migration tracked as Phase 2 task.
    deprecated_member_use: ignore
  language:
    strict-casts: true
    strict-raw-types: true
