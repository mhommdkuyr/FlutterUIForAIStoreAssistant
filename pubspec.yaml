name: FlutterUIForAIStoreAssistant
description: "AI Store Assistant — a Flutter app for small shops and grocery stores with AI-powered inventory, sales, and analytics."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.0.0
  drift: ^2.16.1
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.8.3
  image_picker: ^1.0.4
  mobile_scanner: ^3.0.0
  camera: ^0.11.0
  image: ^4.2.0
  ffi: ^2.1.0
  shared_preferences: ^2.2.0
  intl: ^0.20.2
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.16.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
